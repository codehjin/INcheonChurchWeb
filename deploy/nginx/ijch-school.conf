# 학부모 포털 — ijch-school.kro.kr → church-home 컨테이너 (127.0.0.1:8081)
# 서버 위치: /etc/nginx/sites-available/ijch-school  (sites-enabled 에 링크)
#
# 인증서: sudo certbot certonly --webroot -w /var/www/html -d ijch-school.kro.kr
#   webroot 방식이라 갱신할 때 nginx 를 멈추지 않는다 (아래 80 번 블록이 확인 파일을 내준다).
#   처음 발급할 때는 인증서 파일이 아직 없어 443 블록이 nginx -t 를 통과하지 못한다 →
#   80 번 블록만 먼저 켜고 발급한 뒤 이 파일 전체로 바꾼다 (deploy/README.md).
#
# 학부모앱은 실시간 연결(웹소켓)을 쓰지 않는다 — Upgrade 헤더가 필요 없다.

server {
    listen 80;
    server_name ijch-school.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ijch-school.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/ijch-school.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ijch-school.kro.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;          # 로그인 폼뿐 — 파일을 받지 않는다

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
