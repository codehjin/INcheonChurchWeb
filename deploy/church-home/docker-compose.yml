# 학부모 포털 (ijch-school.kro.kr) — 서버 /home/ubuntu/church-home/docker-compose.yml
# 재정앱 compose(/home/ubuntu/church)와 따로 돈다. 재정앱 배포가 이 컨테이너를 건드리지 않는다.
#
# 🔒 church.db 가 있는 /home/ubuntu/church 는 마운트하지 않는다.
#    재정앱이 내보내는 homedata 폴더 하나만 읽기 전용으로 붙인다 — 컨테이너 안에 church.db 가 존재하지 않는다.
services:
  home:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: church-home
    restart: always
    user: "1654:1654"                 # 이미지의 app 사용자 (root 아님)
    ports:
      - "127.0.0.1:8081:8080"         # nginx 만 붙는다 (바깥에서 8081 로 직접 못 들어온다)
    volumes:
      - ./app:/app:ro                                   # 학부모앱 배포 파일
      - /home/ubuntu/church/homedata:/homedata:ro       # home.db (재정앱이 쓰고, 여기서는 읽기만)
      - ./keys:/keys                                    # 로그인 쿠키 암호화 키 (재시작해도 로그인 유지)
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__HomeConnection=Data Source=/homedata/home.db
      - DataProtection__KeysPath=/keys
      - HOME=/tmp
      - DOTNET_gcServer=0             # 작은 서버 — 워크스테이션 GC 로 메모리를 아낀다
      - TZ=Asia/Seoul
    working_dir: /app
    entrypoint: ["dotnet", "INcheonChurchWeb.Home.dll"]
    read_only: true                   # 컨테이너 파일시스템도 쓰기 금지 (/tmp 만 메모리로)
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
